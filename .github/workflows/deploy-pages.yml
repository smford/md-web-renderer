name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Set permissions for GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare site with latest released engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch index.html from the latest GitHub release
          if gh release view --repo smford/md-web-renderer > /dev/null 2>&1; then
            LATEST_TAG=$(gh release view --repo smford/md-web-renderer --json tagName --jq .tagName)
            echo "Fetching index.html from latest release: $LATEST_TAG..."
            gh release download "$LATEST_TAG" --repo smford/md-web-renderer --pattern "index.html" --dir demo --clobber
          else
            echo "No GitHub release found; using local index.html..."
            cp index.html demo/index.html
          fi
          # Copy README.md into the demo site for easy browsing
          cp README.md demo/README.md
          # Bypass Jekyll processing so raw markdown files are served directly
          touch demo/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './demo'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
