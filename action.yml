name: 'md-web-renderer'
description: 'Zero-build documentation engine for GitHub Pages. Turns folders of markdown files into interactive docs.'
author: 'smford'
branding:
  icon: 'book-open'
  color: 'blue'

inputs:
  path:
    description: 'Path to the directory containing markdown documentation files'
    required: false
    default: '.'
  title:
    description: 'Custom site title and brand name'
    required: false
    default: ''
  cname:
    description: 'Custom domain (CNAME) for GitHub Pages (e.g. docs.example.com)'
    required: false
    default: ''
  custom-css:
    description: 'Path to an optional custom CSS stylesheet to inject'
    required: false
    default: ''
  fallback-readme:
    description: 'If index.md does not exist in target path, copy README.md to index.md'
    required: false
    default: 'true'
  repo-url:
    description: 'Custom repository URL for GitHub corner badge and Edit on GitHub link (defaults to github.server_url/github.repository)'
    required: false
    default: ''
  check-links:
    description: 'Validate relative markdown links for 404s before deploying'
    required: false
    default: 'true'
  upload-pages-artifact:
    description: 'Whether to automatically upload the GitHub Pages artifact ready for deployment'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Prepare documentation directory
      shell: bash
      run: |
        TARGET_DIR="${{ inputs.path }}"
        mkdir -p "$TARGET_DIR"

        # Copy the single-file renderer engine from the action directory
        cp "${{ github.action_path }}/index.html" "$TARGET_DIR/index.html"

        # Prevent GitHub Pages from processing markdown through Jekyll
        touch "$TARGET_DIR/.nojekyll"

        # Optional site title customization
        if [ -n "${{ inputs.title }}" ]; then
          python3 -c "import sys; p, t = sys.argv[1], sys.argv[2]; open(p, 'w', encoding='utf-8').write(open(p, 'r', encoding='utf-8').read().replace('<title>Documentation</title>', f'<title>{t}</title>').replace('<a href=\"#index.md\" id=\"site-title\">Documentation</a>', f'<a href=\"#index.md\" id=\"site-title\">{t}</a>'))" "$TARGET_DIR/index.html" "${{ inputs.title }}"
        fi

        # Optional custom CSS injection
        if [ -n "${{ inputs.custom-css }}" ] && [ -f "${{ inputs.custom-css }}" ]; then
          cp "${{ inputs.custom-css }}" "$TARGET_DIR/custom.css"
          python3 -c "import sys; p = sys.argv[1]; open(p, 'w', encoding='utf-8').write(open(p, 'r', encoding='utf-8').read().replace('</head>', '<link rel=\"stylesheet\" href=\"custom.css\">\n</head>'))" "$TARGET_DIR/index.html"
        fi

        # Optional CNAME for custom domains
        if [ -n "${{ inputs.cname }}" ]; then
          echo "${{ inputs.cname }}" > "$TARGET_DIR/CNAME"
        fi

        # Fallback: copy README.md to index.md if index.md does not exist
        if [ "${{ inputs.fallback-readme }}" = "true" ]; then
          if [ ! -f "$TARGET_DIR/index.md" ]; then
            if [ -f "$TARGET_DIR/README.md" ]; then
              echo "Using $TARGET_DIR/README.md as index.md"
              cp "$TARGET_DIR/README.md" "$TARGET_DIR/index.md"
            elif [ -f "README.md" ]; then
              echo "Using root README.md as $TARGET_DIR/index.md"
              cp "README.md" "$TARGET_DIR/index.md"
            fi
          fi
        fi

        # Optional repo URL injection for GitHub badge and Edit on GitHub link
        REPO_URL="${{ inputs.repo-url }}"
        if [ -z "$REPO_URL" ] && [ -n "$GITHUB_SERVER_URL" ] && [ -n "$GITHUB_REPOSITORY" ]; then
          REPO_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
        fi
        if [ -n "$REPO_URL" ]; then
          python3 -c "import sys; p, u = sys.argv[1], sys.argv[2]; open(p, 'w', encoding='utf-8').write(open(p, 'r', encoding='utf-8').read().replace('</head>', f'<meta name=\"repo-url\" content=\"{u}\">\n</head>'))" "$TARGET_DIR/index.html" "$REPO_URL"
        fi

        # Optional link validation check
        if [ "${{ inputs.check-links }}" = "true" ]; then
          python3 -c "
          import os, sys, re, glob
          target_dir = sys.argv[1]
          broken = []
          md_files = glob.glob(os.path.join(target_dir, '**/*.md'), recursive=True)
          for f in md_files:
              content = open(f, 'r', encoding='utf-8', errors='ignore').read()
              for m in re.finditer(r'\[(?:[^\]]+)\]\(([^)]+)\)', content):
                  link = m.group(1).split('#')[0]
                  if link and not link.startswith(('http://', 'https://', 'mailto:', '#', 'data:')):
                      base = os.path.dirname(f)
                      resolved = os.path.normpath(os.path.join(base, link))
                      if not os.path.exists(resolved):
                          broken.append((f, link))
          if broken:
              print('::warning::[md-web-renderer] Found relative links to non-existent files:')
              for f, link in broken[:10]:
                  print(f'::warning file={f}::Broken relative link: {link}')
              if len(broken) > 10:
                  print(f'::warning::... and {len(broken) - 10} more broken links')
          else:
              print('[md-web-renderer] All relative links validated successfully.')
          " "$TARGET_DIR"
        fi

    - name: Upload Pages artifact
      if: ${{ inputs.upload-pages-artifact == 'true' }}
      uses: actions/upload-pages-artifact@v3
      with:
        path: ${{ inputs.path }}
